<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<meta name="description" content="指浪诀：把常用、好玩、有趣的互联网入口收在一起。">
<title>指浪诀 · 个人网络收藏</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="site-header">
  <div class="shell header-row">
    <a class="brand" href=".">
      <span class="mark">指</span>
      <span><h1>指浪诀</h1><p>个人网络收藏 · 随手一指，去看点有意思的</p></span>
    </a>
    <a class="header-link" href="https://link.pixcat.cn" target="_blank" rel="noopener noreferrer">收藏来源 ↗</a>
  </div>
</header>
<main class="shell">
  <section class="hero">
    <div>
      <p class="eyebrow">A small corner of the web</p>
      <h2>把互联网里<br><em>好玩的入口</em>收好。</h2>
      <p class="hero-copy"><strong>指浪诀</strong> 是我的个人网络收藏夹。工具、灵感、资源、游戏和一些说不清但值得点开的东西，都在这里。</p>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" type="search" placeholder="搜索网站、分类或关键词" autocomplete="off">
      <button id="clear" class="clear" type="button">清除</button>
    </div>
  </section>
  <div class="main-grid">
    <aside class="sidebar">
      <p class="sidebar-title">分类浏览</p>
      <select id="categorySelect" class="category-select" aria-label="选择网站分类"></select>
      <nav id="categories" class="category-list" aria-label="网站分类"></nav>
    </aside>
    <section>
      <div class="content-head"><h3 id="heading">精选入口</h3><p id="count" class="result-count"></p></div>
      <p id="mobileHint" class="mobile-hint"></p>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty"><strong>没有找到这个入口</strong><span>换个关键词，或从左侧挑一个分类看看。</span></div>
    </section>
  </div>
</main>
<footer class="site-footer shell"><span>指浪诀 · 把常用的留在手边</span><a href="https://link.pixcat.cn" target="_blank" rel="noopener noreferrer">部分收藏整理自 link.pixcat.cn ↗</a></footer>
<div id="gestureMenu" class="gesture-menu" aria-hidden="true"></div>
<script src="./app.js" defer></script>
</body>
</html>
